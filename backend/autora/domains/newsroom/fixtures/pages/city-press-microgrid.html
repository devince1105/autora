    <h1>流明市港區社區微電網啟用 市府：停電時可供電六小時</h1>
    <p>發布日期：2026 年 9 月 14 日</p>
    <p>流明市政府今日宣布，港區社區微電網正式啟用。微電網串連 1,200 組屋頂太陽能板與 4 MWh 儲能電池，
       停電時可維持約 3,000 戶供電六小時。</p>
    <p>本計畫總經費新台幣 4.2 億元，由市府能源處執行。</p>
    <p>能源處處長陳美拉表示：「港區是五個示範區中的第一個，下一個示範區將在累積一年數據後決定。」</p>
