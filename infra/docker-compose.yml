name: autora

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: autora
      POSTGRES_PASSWORD: autora
      POSTGRES_DB: autora
    ports:
      - "${AUTORA_DB_PORT:-5434}:5432"
    volumes:
      - autora-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autora -d autora"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+asyncpg://autora:autora@db:5432/autora
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    volumes:
      - autora-blobs:/app/data/blobs   # step blobs written by the worker, served by the API
    depends_on:
      db:
        condition: service_healthy

  worker:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://autora:autora@db:5432/autora
    env_file:
      - ../.env
    volumes:
      - autora-blobs:/app/data/blobs
    stop_grace_period: 40s   # SIGTERM lets in-flight runs finish (worker grace: 30s)
    depends_on:
      db:
        condition: service_healthy

  web:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  autora-db-data:
  autora-blobs:
