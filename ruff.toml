# Repo-wide Ruff config (applies to everything under backend/).
line-length = 100
target-version = "py312"
src = ["backend", "backend/api", "backend/worker"]
extend-exclude = [".venv", "node_modules"]

[lint]
select = ["E", "F", "I", "B", "UP"]

[lint.isort]
known-first-party = ["autora"]

[lint.per-file-ignores]
# Autogenerated migrations contain long constraint expressions; don't hand-wrap SQL.
"backend/autora/db/migrations/versions/*" = ["E501"]
