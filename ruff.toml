# Repo-wide Ruff config (applies to packages/autora and apps/*).
line-length = 100
target-version = "py312"
src = ["packages/autora", "apps/api", "apps/worker"]
extend-exclude = [".venv", "node_modules"]

[lint]
select = ["E", "F", "I", "B", "UP"]

[lint.isort]
known-first-party = ["autora"]

[lint.per-file-ignores]
# Autogenerated migrations contain long constraint expressions; don't hand-wrap SQL.
"packages/autora/autora/db/migrations/versions/*" = ["E501"]
